<body><div class="app-shell">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">♜</span><span>Kale Muhafızları<small>MEYDAN SENİN</small></span></div><div class="top-actions"><button id="training-button" class="training-button" title="Kora’nın talim alanı" aria-label="Kora’nın talim alanı">✦ <span>Talim</span></button><button id="sound-button" class="icon-button" aria-label="Sesi aç"></button><button id="help-button" class="icon-button" aria-label="Nasıl oynanır?"></button><button id="settings-button" class="icon-button" aria-label="Ayarlar"></button></div></header>

</section>
<section class="command-panel" aria-label="Hamle tepsisi"><div class="command-top"><div id="command-actor" class="command-actor"></div><span id="round-number" class="round-number"></span></div><div id="command-content" class="command-content"></div><div id="move-preview" class="move-preview"></div><button id="action-button" class="primary-button action-button"></button><p id="action-note" class="action-note"></p></section>
